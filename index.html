<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R1 Cube 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
        body { background: #0d0d0d; color: #fff; width: 240px; height: 282px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px; }
        .header { display: flex; width: 100%; justify-content: space-between; align-items: center; height: 24px; width: 100%; }
        .title { color: #ff5a00; font-weight: bold; font-size: 11px; }
        select { background: #222; color: #fff; border: 1px solid #444; font-size: 10px; border-radius: 3px; }
        #canvas-container { width: 230px; height: 150px; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        .move-bar { width: 100%; display: flex; overflow-x: auto; gap: 3px; padding: 3px 2px; scrollbar-width: none; background: #161616; border-radius: 4px; }
        .m-btn { background: #333; color: #fff; border: none; padding: 3px 6px; font-size: 10px; border-radius: 3px; min-width: 28px; }
        .controls { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .btn { background: #222; color: #fff; border: 1px solid #444; padding: 5px; font-size: 10px; border-radius: 4px; text-align: center; font-weight: bold; }
        .btn:active { background: #ff5a00; }
    </style>
    <script src="https://cloudflare.com"></script>

</head>
<body>
    <div class="header">
        <span class="title">R1 CUBE 3D</span>
        <select id="cube-size" onchange="changeSize(parseInt(this.value))"><option value="2">2x2</option><option value="3" selected>3x3</option></select>
    </div>
    <div id="canvas-container"></div>
    <div class="move-bar">
        <button class="m-btn" onclick="animateMove('U')">U</button><button class="m-btn" onclick="animateMove('U\'')">U'</button>
        <button class="m-btn" onclick="animateMove('F')">F</button><button class="m-btn" onclick="animateMove('F\'')">F'</button>
        <button class="m-btn" onclick="animateMove('R')">R</button><button class="m-btn" onclick="animateMove('R\'')">R'</button>
    </div>
    <div class="controls">
        <div class="btn" onclick="scramble()">EMBARALHAR</div>
        <div class="btn" id="solve-btn" onclick="toggleSolve()">AUTO RESOLVER</div>
    </div>
    <script>
        let scene, camera, renderer, cubeGroup, cubeSize = 3, moveHistory = [], isSolving = false, solveInterval;
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(45, 230 / 150, 0.1, 1000);
            camera.position.set(4, 4, 6); camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setSize(230, 150);
            container.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8)); buildCube(); animate();
        }
        function buildCube() {
            if (cubeGroup) scene.remove(cubeGroup); cubeGroup = new THREE.Group();
            const mats = [0xff0000, 0xffa500, 0xffffff, 0xffff00, 0x008000, 0x0000ff].map(c => new THREE.MeshBasicMaterial({color: c}));
            const offset = (cubeSize - 1) / 2;
            for (let x = 0; x < cubeSize; x++) {
                for (let y = 0; y < cubeSize; y++) {
                    for (let z = 0; z < cubeSize; z++) {
                        if (x === 0 || x === cubeSize-1 || y === 0 || y === cubeSize-1 || z === 0 || z === cubeSize-1) {
                            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.95, 0.95), mats);
                            mesh.position.set(x - offset, y - offset, z - offset); cubeGroup.add(mesh);
                        }
                    }
                }
            }
            scene.add(cubeGroup);
        }
        function changeSize(size) { cubeSize = size; moveHistory = []; if(isSolving) toggleSolve(); buildCube(); }
        function animateMove(move) {
            if (!isSolving) moveHistory.push(move);
            if (move.startsWith('U')) cubeGroup.rotation.y += move.includes("'") ? 0.3 : -0.3;
            if (move.startsWith('R')) cubeGroup.rotation.x += move.includes("'") ? -0.3 : 0.3;
            if (move.startsWith('F')) cubeGroup.rotation.z += move.includes("'") ? 0.3 : -0.3;
        }
        function scramble() {
            const moves = ['U', 'U\'', 'R', 'R\'', 'F', 'F\'']; moveHistory = [];
            for(let i=0; i<10; i++) { let m = moves[Math.floor(Math.random() * moves.length)]; animateMove(m); moveHistory.push(m); }
        }
        function toggleSolve() {
            const btn = document.getElementById('solve-btn');
            if (isSolving) { clearInterval(solveInterval); isSolving = false; btn.innerText = "AUTO RESOLVER"; }
            else {
                if (moveHistory.length === 0) return; isSolving = true; btn.innerText = "RESOLVENDO...";
                solveInterval = setInterval(() => {
                    if (moveHistory.length > 0) {
                        let last = moveHistory.pop(); let inv = last.includes("'") ? last.replace("'", "") : last + "'";
                        if (inv.startsWith('U')) cubeGroup.rotation.y += inv.includes("'") ? 0.3 : -0.3;
                        if (inv.startsWith('R')) cubeGroup.rotation.x += inv.includes("'") ? -0.3 : 0.3;
                        if (inv.startsWith('F')) cubeGroup.rotation.z += inv.includes("'") ? 0.3 : -0.3;
                    } else { toggleSolve(); cubeGroup.rotation.set(0,0,0); }
                }, 350);
            }
        }
        function animate() { requestAnimationFrame(animate); if(!isSolving && moveHistory.length === 0) { cubeGroup.rotation.x += 0.005; cubeGroup.rotation.y += 0.005; } renderer.render(scene, camera); }
        window.onload = init3D;
    </script>
</body>
</html>
